services:
  nginx:
    image: nginx:alpine
    container_name: lockbox-edge
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - public-net
      - backend-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - public-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/data/database.db
    volumes:
      - db-data:/app/data
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  public-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db-data:
