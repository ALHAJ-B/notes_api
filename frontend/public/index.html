<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockBox | Secure Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">LockBox</div>
        </header>

        <main class="main-content">
            <!-- Auth Section -->
            <section id="auth-section" class="view-section">
                <div class="auth-card">
                    <div class="auth-header">
                        <h2>Access Vault</h2>
                        <p>End-to-end encrypted notes.</p>
                    </div>

                    <div class="tabs">
                        <button type="button" class="tab-btn " id="login-tab">Login</button>
                        <button type="button" class="tab-btn active" id="register-tab">Register</button>
                    </div>
                    
                    <form id="auth-form" class="auth-form">
                        <input type="hidden" name="action" id="auth-action" value="login">
                        
                        <div class="input-group">
                            <label for="username">Email</label>
                            <input type="email" name="username" id="username" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="password">Master Password</label>
                            <input type="password" name="password" id="password" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn-primary" id="auth-submit-btn">Login to Vault</button>
                    </form>
                </div>
            </section>

            <!-- Notes Section -->
            <section id="notes-section" class="view-section hidden">
                <div class="vault-header">
                    <h2>Your Notes</h2>
                    <button type="button" id="logout-btn" class="btn-text">Logout</button>
                </div>

                <form id="note-form" class="note-form">
                    <textarea id="note-input" name="content" placeholder="Write something secret..." rows="3" required></textarea>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Note</button>
                    </div>
                </form>

                <div id="notes-list" class="notes-grid">
                    <!-- Notes injected here -->
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="script.js?v=2"></script>
</body>
</html>
